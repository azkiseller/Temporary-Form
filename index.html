<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت تسک‌ها</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preload" href="fonts/IRANSansX-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/IRANSansX-700.woff2" as="font" type="font/woff2" crossorigin>
<script>
(function () {
  try {
    var mode = localStorage.getItem('vcThemeMode') || 'system';
    var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<style>
@font-face { font-family: 'IRANSansX'; font-weight: 400; font-display: swap; src: url('fonts/IRANSansX-400.woff2') format('woff2'); }
@font-face { font-family: 'IRANSansX'; font-weight: 600; font-display: swap; src: url('fonts/IRANSansX-600.woff2') format('woff2'); }
@font-face { font-family: 'IRANSansX'; font-weight: 700; font-display: swap; src: url('fonts/IRANSansX-700.woff2') format('woff2'); }
@font-face { font-family: 'IRANSansX'; font-weight: 900; font-display: swap; src: url('fonts/IRANSansX-900.woff2') format('woff2'); }

:root {
  --surface: rgba(255,255,255,.72);
  --surface-tint: rgba(217,236,255,.55);
  --ink: #0F1B33;
  --ink-soft: rgba(15,27,51,.68);
  --ink-faint: rgba(15,27,51,.46);
  --line: rgba(23,169,255,.32);
  --accent: #00B4FF;
  --accent-deep: #1656F5;
  --accent-soft: rgba(0,180,255,.20);
  --accent-strong: #0D8FCB;
  --danger: #E0453F; --danger-soft: rgba(224,69,63,.14);
  --good: #1FA971;   --good-soft: rgba(31,169,113,.14);
  --warn: #C9780C;   --warn-soft: rgba(224,138,23,.16);
  --gray: #5B6474;   --gray-soft: rgba(91,100,116,.13);
  --radius-lg: 20px; --radius: 14px; --radius-sm: 9px; --glass-blur: 18px;
  --shadow-card: 0 8px 28px rgba(15,72,150,.14), inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-float: 0 24px 55px -14px rgba(15,72,150,.22), inset 0 1px 0 rgba(255,255,255,.7);
  --font: 'IRANSansX', Tahoma, sans-serif;
  --topbar-bg: rgba(255,255,255,.4);
  --pop-bg: rgba(255,255,255,.94);
  --pop-solid: #F7FBFF;
  --th-bg: rgba(225,240,255,.92);
}
html[data-theme="dark"] {
  --surface: rgba(255,255,255,.07);
  --surface-tint: rgba(255,255,255,.04);
  --ink: #EAF0FB; --ink-soft: rgba(234,240,251,.68); --ink-faint: rgba(234,240,251,.44);
  --line: rgba(255,255,255,.14);
  --accent-deep: #4C8DFF; --accent-soft: rgba(0,180,255,.22); --accent-strong: #29C2FF;
  --danger: #FF6B64; --danger-soft: rgba(255,107,100,.18);
  --good: #34C98C;   --good-soft: rgba(52,201,140,.18);
  --warn: #F2A93B;   --warn-soft: rgba(242,169,59,.18);
  --gray: #A3AEC2;   --gray-soft: rgba(163,174,194,.15);
  --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-float: 0 24px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  --topbar-bg: rgba(10,15,28,.22);
  --pop-bg: rgba(18,25,45,.96);
  --pop-solid: #141c31;
  --th-bg: rgba(22,32,58,.96);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: #0c1226; color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.75; }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }
html.theme-switching *, html.theme-switching *::before, html.theme-switching *::after { transition: none !important; }
button, input, select, textarea { font-family: var(--font); }

.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.50), transparent 62%),
    radial-gradient(680px 540px at 106% 6%, rgba(22,86,245,.32), transparent 62%),
    radial-gradient(700px 560px at 88% 102%, rgba(0,140,230,.24), transparent 62%),
    radial-gradient(640px 520px at 4% 104%, rgba(22,86,245,.20), transparent 62%),
    linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
}
html[data-theme="dark"] .bg-glow {
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.30), transparent 60%),
    radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.26), transparent 60%),
    radial-gradient(700px 560px at 88% 102%, rgba(22,86,245,.24), transparent 60%),
    radial-gradient(640px 520px at 4% 104%, rgba(0,120,220,.18), transparent 60%),
    linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
}
@keyframes glow-shift { 0%,100% { filter: saturate(1); } 50% { filter: saturate(1.15); } }
@media (prefers-reduced-motion: reduce) { .bg-glow { animation: none; } }

.theme-toggle {
  position: fixed; bottom: 16px; left: 16px; z-index: 9999; display: flex; gap: 2px; padding: 4px; border-radius: 999px;
  background: var(--surface); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid var(--line); box-shadow: var(--shadow-card);
}
.theme-toggle button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-soft);
  display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
.theme-toggle button:hover { color: var(--ink); }
.theme-toggle button.on { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; }
.theme-toggle svg { width: 18px; height: 18px; }

/* ---------- top bar ---------- */
#app { position: relative; z-index: 1; min-height: 100vh; }
header.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--topbar-bg); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line); padding: 12px 28px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
@media (max-width: 560px) { header.topbar { padding: 10px 16px; } }
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar-right { gap: 8px; }
.topbar-brand { display: flex; align-items: center; padding-inline-end: 14px; margin-inline-end: 2px; border-inline-end: 1px solid var(--line); }
.topbar-brand img { height: 24px; width: auto; display: block; }
html[data-theme="dark"] .topbar-brand img { filter: drop-shadow(0 0 6px rgba(0,180,255,.25)); }
.app-icon { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff;
  display: grid; place-items: center; box-shadow: 0 6px 16px -6px rgba(22,86,245,.5); flex-shrink: 0; }
.app-title { font-weight: 800; font-size: 15px; line-height: 1.4; }
.app-sub { font-size: 11.5px; color: var(--ink-faint); opacity: .85; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.pill:hover { border-color: var(--accent); }
.pill.static { cursor: default; } .pill.static:hover { border-color: var(--line); }
.pill .role { color: var(--accent-strong); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: var(--good); color: var(--good); }
.seg { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.seg button { border: 0; background: transparent; color: var(--ink-soft); padding: 5px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: .15s; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; box-shadow: 0 6px 14px -6px rgba(22,86,245,.55); }

main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 8px; }
main.narrow { max-width: 820px; }
@media (max-width: 560px) { main { padding: 18px 14px 8px; } }

/* ---------- panels ---------- */
.panel {
  position: relative; background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%); backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
  padding: 20px 22px; margin-bottom: 18px;
}
.panel.top { z-index: 20; }
.panel h2 { font-size: 15px; margin: 0 0 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: -.2px; }
.panel .help { color: var(--ink-soft); font-size: 12.5px; margin: -8px 0 12px; white-space: pre-line; }
.step { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12.5px; font-weight: 900; color: #fff; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep)); box-shadow: 0 4px 12px -4px rgba(22,86,245,.55); }
.req { color: var(--danger); font-weight: 900; }
.page-title { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; }
.page-title h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.3px; }
.page-title .sub { color: var(--ink-soft); font-size: 12.5px; }

.field-in, textarea, select, input[type=password], input[type=text] {
  width: 100%; background: var(--surface-tint); border: 1.5px solid var(--line); border-radius: var(--radius-sm); color: var(--ink);
  -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
  box-shadow: inset 0 1px 4px rgba(15,72,150,.10); transition: border-color .15s, box-shadow .15s, background .15s;
  padding: 10px 14px; font-size: 14px;
}
.field-in.big { font-size: 18px; font-weight: 700; padding: 12px 16px; letter-spacing: .5px; }
textarea { min-height: 100px; resize: vertical; line-height: 1.8; }
.field-in::placeholder, textarea::placeholder { color: var(--ink-faint); }
textarea:focus, .field-in:focus, select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
select { width: auto; padding: 7px 10px; font-size: 13px; box-shadow: none; }
select option { color: #0F1B33; background: #fff; }
html[data-theme="dark"] select option { color: #EAF0FB; background: #161d31; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
.ltr { direction: ltr; text-align: left; }
.err-field .field-in, .err-field textarea, .err-field .opt-grid { border-color: var(--danger) !important; box-shadow: 0 0 0 4px var(--danger-soft); border-radius: var(--radius-sm); }
.err-text { color: var(--danger); font-size: 12.5px; font-weight: 700; margin-top: 8px; }

.controls { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 12.5px; font-weight: 700; }
.count-badge { display: inline-flex; align-items: baseline; gap: 5px; padding: 6px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; font-size: 12.5px; }
.count-badge b { font-size: 16px; font-weight: 900; }
.spacer { flex: 1; }

.btn { border: 1px solid transparent; border-radius: var(--radius-sm); padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .15s, filter .15s, box-shadow .15s; color: var(--ink); white-space: nowrap; }
.btn.primary { border-color: rgba(255,255,255,.45); background: linear-gradient(135deg, rgba(23,169,255,.92) 0%, rgba(22,86,245,.92) 100%); color: #fff;
  box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
.btn.ghost { background: var(--surface); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
.btn.danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(224,69,63,.3); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.wide { min-width: 160px; justify-content: center; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.icon-btn { border: 1px solid transparent; background: transparent; color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
  display: inline-grid; place-items: center; transition: .12s; }
.icon-btn:hover { border-color: var(--line); background: var(--surface-tint); color: var(--accent-strong); }
.icon-btn.del:hover { color: var(--danger); background: var(--danger-soft); }
.icon-btn svg { width: 16px; height: 16px; }

/* option chips (task picker) */
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-tint); border-radius: 11px; padding: 10px 12px;
  cursor: pointer; color: var(--ink); font-size: 13px; font-weight: 700; text-align: right; transition: .12s; line-height: 1.6; font-family: var(--font); }
.opt:hover { border-color: var(--accent); transform: translateY(-1px); }
.opt .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; display: grid; place-items: center; color: #fff; }
.opt.multi .ck { border-radius: 6px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.opt.sel .ck { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: transparent; }
.opt .ck svg { width: 12px; height: 12px; opacity: 0; } .opt.sel .ck svg { opacity: 1; }

/* summary cards */
.summary-row { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; }
@media (max-width: 760px) { .summary-row { grid-template-columns: repeat(2, 1fr); } }
.summary-card {
  background: linear-gradient(135deg, rgba(22,86,245,.62) 0%, rgba(23,169,255,.62) 100%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%); backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid rgba(255,255,255,.4); border-radius: var(--radius-lg); padding: 14px 16px; min-height: 92px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center;
  box-shadow: 0 16px 34px -16px rgba(22,86,245,.5), inset 0 1px 0 rgba(255,255,255,.45); position: relative; overflow: hidden;
}
.summary-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(140px 140px at 90% 0%, rgba(255,255,255,.25), transparent 70%); }
.summary-card .label { font-size: 12px; color: rgba(255,255,255,.9); font-weight: 600; position: relative; }
.summary-card .value { font-size: 22px; font-weight: 900; color: #fff; position: relative; white-space: nowrap; font-variant-numeric: tabular-nums; }
.summary-card .value.sm { font-size: 15px; }
.msg { margin-top: 8px; font-size: 13px; color: var(--ink-soft); min-height: 20px; font-weight: 600; }
.msg.err { color: var(--danger); } .msg.ok { color: var(--good); }

/* task chips (report filter) */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-bottom: 18px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; transition: .15s; text-align: right;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
.chip:hover { transform: translateY(-2px); border-color: var(--accent); }
.chip.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-card); }
.chip .n { font-size: 24px; font-weight: 900; line-height: 1.3; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.chip .t { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.5; }
.chip.zero .n { color: var(--ink-faint); }

/* tables */
.tbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.tbar h2 { margin: 0; }
.search { flex: 1; min-width: 180px; padding: 9px 14px; font-size: 13.5px; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); max-height: 620px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; background: var(--th-bg); color: var(--ink-soft); font-weight: 700; font-size: 12px; text-align: right; padding: 10px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--surface-tint); }
.code { font-family: ui-monospace, Consolas, monospace; direction: ltr; text-align: left; font-size: 12.5px; white-space: nowrap; letter-spacing: .3px; }
.nowrap { white-space: nowrap; }
.tag { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.tag.ok { background: var(--good-soft); color: var(--good); } .tag.bad { background: var(--danger-soft); color: var(--danger); }
.tag.doc { background: var(--accent-soft); color: var(--accent-deep); } .tag.err { background: var(--gray-soft); color: var(--gray); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 44px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }
.more { padding: 10px; text-align: center; color: var(--ink-faint); font-size: 12.5px; }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.bar-cell span { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--accent-deep), var(--accent)); }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; width: min(520px, 92vw); box-shadow: var(--shadow-float); color: var(--ink);
  background: var(--pop-bg); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
dialog::backdrop { background: rgba(8,14,30,.45); backdrop-filter: blur(3px); }
dialog h3 { margin: 0 0 14px; font-weight: 800; }
dialog label.l { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 12px 0 6px; }
dialog .controls { margin-top: 18px; flex-direction: row-reverse; justify-content: flex-start; }
dialog pre { background: var(--surface-tint); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; user-select: all; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid2 select { width: 100%; padding: 10px 12px; }

/* login */
.login { max-width: 400px; margin: 11vh auto 0; padding: 0 16px; }
.login .panel { padding: 28px; }
.login .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.login label.l { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 14px 0 6px; }

/* editor */
.fed { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; background: var(--surface-tint); }
.fed .row1 { display: grid; grid-template-columns: 1fr 210px; gap: 10px; }
@media (max-width: 600px) { .fed .row1 { grid-template-columns: 1fr; } }
.fed .row1 select { width: 100%; padding: 10px 12px; }
.fed .tools { display: flex; align-items: center; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
.fed .tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-inline-end: 12px; cursor: pointer; }
.team-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
@media (max-width: 760px) { .team-opts { grid-template-columns: 1fr; } }
.team-opts .tl { font-size: 12px; font-weight: 800; color: var(--accent-strong); margin-bottom: 4px; }
.ulist { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 12px; background: var(--surface-tint); margin-top: 8px; }
.ulist label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
.radio-line { display: flex; gap: 18px; flex-wrap: wrap; }
.radio-line label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }

.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .team-grid { grid-template-columns: 1fr; } }
.team-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface-tint); cursor: pointer; transition: .15s; }
.team-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.team-card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.team-card .th { display: flex; align-items: center; font-size: 15px; font-weight: 800; }

/* ---------- jalali (shamsi) calendar ---------- */
function div(a, b) { return ~~(a / b); }
function g2j(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979; gy -= gy <= 1600 ? 621 : 1600;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365 * gy + div(gy2 + 3, 4) - div(gy2 + 99, 100) + div(gy2 + 399, 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * div(days, 12053); days %= 12053; jy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { jy += div(days - 1, 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + div(days, 31) : 7 + div(days - 186, 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);

  const val = p => sk.k === "__total" ? p.s : sk.k === "__name" ? p.n : sk.k === "__code" ? p.u : (p.c[sk.k] || 0);
  list.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y, "fa") : x - y) * sk.dir; });
  return {f, optF, team, rows, cols, list, colTot, total: rows.length, sk};
}
function renderPivot() {
  const m = $("#main"); if (!m) return;
  const sup = isSup();
  if (!S.reportForms.length) { m.innerHTML = `<div class="panel empty">هنوز فرمی وجود ندارد.</div>`; return; }
  const P = pivotData(), maxCell = Math.max(1, ...P.list.flatMap(p => P.cols.map(c => p.c[c] || 0)));
  const arrow = k => P.sk.k === k ? (P.sk.dir < 0 ? " ▼" : " ▲") : "";
  const people = P.list.length, avg = people ? Math.round(10 * P.total / people) / 10 : 0;
  m.innerHTML = `<div class="page-title"><h1>مدیریت تسک${P.team ? " — تیم " + esc(P.team) : sup ? " — همه تیم‌ها" : ""}</h1><span class="sub">${P.f ? esc(P.f.title) : ""} · ${rangeLabel()}</span></div>
    <section class="panel top"><h2><span class="step">${CAL_IC}</span>بازه‌ی زمانی و خروجی Excel</h2>
      <div class="controls">${rangeControlsHTML(sup)}<span class="spacer"></span>
      <button class="btn ghost sm" id="rr">${IC.refresh} بروزرسانی</button>
      <button class="btn primary" id="px" ${P.list.length ? "" : "disabled"}>${IC.dl} دانلود Excel</button></div>
      <div class="help" style="margin:10px 0 0">فایل Excel دو برگه دارد: «مدیریت تسک» (همین جدول) و «ثبت‌ها» (همه‌ی ثبت‌های این بازه با شماره سفارش و ستون تکراری).</div></section>
    <div class="summary-row">
      <div class="summary-card"><div class="label">کل تسک‌های ثبت‌شده</div><div class="value">${fa(P.total)}</div></div>
      <div class="summary-card"><div class="label">تعداد کارشناس</div><div class="value">${fa(people)}</div></div>
      <div class="summary-card"><div class="label">میانگین هر نفر</div><div class="value">${fa(avg)}</div></div>
      <div class="summary-card"><div class="label">پرتکرارترین تسک</div><div class="value sm">${esc(P.cols.slice().sort((a, b) => P.colTot[b] - P.colTot[a])[0] || "—")}</div></div>
    </div>
    <section class="panel"><div class="tbar"><h2><span class="step">۱</span>تعداد تسک به تفکیک کارشناس</h2><span class="spacer"></span>
      <span style="color:var(--ink-faint);font-size:12px">روی عنوان ستون برای مرتب‌سازی و روی هر عدد برای دیدن ثبت‌ها کلیک کنید</span></div>
    ${!P.list.length ? `<div class="empty">در این بازه تسکی ثبت نشده است</div>` : `
    <div class="tablewrap pivot-wrap"><table class="pivot"><thead>
      <tr class="grp-row"><th colspan="${sup && !P.team ? 3 : 2}" class="corner">تعداد</th><th colspan="${P.cols.length}" class="grp">عنوان تسک</th><th class="tot-col"></th></tr>
      <tr><th data-sort="__code" class="sortable">کد داخلی${arrow("__code")}</th><th data-sort="__name" class="sortable">نام کارشناس${arrow("__name")}</th>${sup && !P.team ? "<th>تیم</th>" : ""}
        ${P.cols.map(c => `<th data-sort="${esc(c)}" class="sortable task-h">${esc(c)}${arrow(c)}</th>`).join("")}
        <th data-sort="__total" class="sortable tot-col">جمع کل${arrow("__total")}</th></tr></thead><tbody>
      ${P.list.map(p => `<tr${p.d ? ' class="has-dup"' : ""}><td class="code" style="text-align:right">${esc(p.u)}</td><td class="nowrap name-c">${esc(p.n)}${p.d ? ` <span class="tag bad" title="ثبت تکراری">${fa(p.d)} تکراری</span>` : ""}</td>${sup && !P.team ? `<td class="nowrap">${esc(p.t)}</td>` : ""}
        ${P.cols.map(c => { const v = p.c[c] || 0; return `<td class="num${v ? " hit" : ""}" ${v ? `data-u="${esc(p.u)}" data-t="${esc(c)}" style="--h:${(0.08 + 0.42 * v / maxCell).toFixed(2)}"` : ""}>${v ? fa(v) : ""}</td>`; }).join("")}
        <td class="num tot-col"><b>${fa(p.s)}</b></td></tr>`).join("")}
      </tbody><tfoot><tr><td colspan="${sup && !P.team ? 3 : 2}"><b>جمع کل</b></td>${P.cols.map(c => `<td class="num"><b>${fa(P.colTot[c])}</b></td>`).join("")}<td class="num tot-col"><b>${fa(P.total)}</b></td></tr></tfoot>
    </table></div>`}</section>`;
  bindRangeControls(renderPivot);
  $("#rr").onclick = loadResponses;
  $("#px").onclick = () => exportPivot(P);
  m.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort, cur = S.pivotSort || {k: "__total", dir: -1};
    S.pivotSort = {k, dir: cur.k === k ? -cur.dir : (k === "__name" || k === "__code" ? 1 : -1)}; renderPivot(); });
  m.querySelectorAll("td.hit").forEach(td => td.onclick = () => {
    S.respOpt = P.optF ? td.dataset.t : null; S.respFilter = td.dataset.u; S.dupOnly = false;
    S.tab = "resp"; shell("", false); renderResponses(); window.scrollTo({top: 0});
  });
}
async function exportPivot(P) {
  const sup = isSup(), withTeam = sup && !P.team;
  const head = ["کد داخلی", "نام کارشناس", ...(withTeam ? ["تیم"] : []), ...P.cols, "جمع کل", "تکراری"];
  const body = P.list.map(p => [p.u, p.n, ...(withTeam ? [p.t] : []), ...P.cols.map(c => p.c[c] || ""), p.s, p.d || ""]);
  const foot = ["جمع کل", "", ...(withTeam ? [""] : []), ...P.cols.map(c => P.colTot[c]), P.total, ""];
  const a = jStr(S.range.from).replace(/\//g, "-"), b = jStr(S.range.to).replace(/\//g, "-");
  const name = `مدیریت تسک - ${P.team || "همه تیم‌ها"} - ${a === b ? a : a + " تا " + b}`;
  const fcols = (P.f?.fields || []).filter(x => x.type !== "section");
  const rawHead = ["زمان ثبت", "ثبت‌کننده", "داخلی", "تیم", ...fcols.map(c => c.label), "تکراری"];
  const raw = P.rows.map(r => [fmtDT(r.created_at), r.full_name || "", r.username || "", r.team || "", ...fcols.map(c => cellVal(r.data[c.id])), r._dup ? `بله (${r._dupN} بار)` : ""]);
  const btn = $("#px"); if (btn) btn.disabled = true;
  try {
    if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const mk = aoa => { const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = aoa[0].map((h, i) => ({wch: Math.min(45, Math.max(String(h).length, ...aoa.slice(1, 300).map(r => String(r[i] ?? "").length)) + 2)})); return ws; };
    const wb = XLSX.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]};
    XLSX.utils.book_append_sheet(wb, mk([head, ...body, foot]), "مدیریت تسک");
    XLSX.utils.book_append_sheet(wb, mk([rawHead, ...raw]), "ثبت‌ها");
    XLSX.writeFile(wb, `${name}.xlsx`);
  } catch (e) {
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    download(new Blob(["﻿" + [head, ...body, foot].map(r => r.map(q).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"}), `${name}.csv`);
    toast("کتابخانه Excel بارگذاری نشد؛ فایل CSV دانلود شد", 1);
  } finally { if (btn) btn.disabled = false; }
}

/* ---------- team tasks: team lead = own team, supervisor = all teams ---------- */
function taskFields() {
  const out = [];
  S.reportForms.forEach(f => f.fields.forEach(x => { if (x.team_options && typeof x.team_options === "object") out.push({f, x}); }));
  return out;
}
function renderTasks() {
  const m = $("#main"), teams = isSup() ? TEAMS : [S.me.team], tf = taskFields();
  S.taskEdit = S.taskEdit || {};
  if (!tf.length) { m.innerHTML = `<div class="panel empty">فرمی با تسک‌های تیمی وجود ندارد.</div>`; return; }
  m.innerHTML = `<div class="page-title"><h1>${isSup() ? "تسک‌های تیم‌ها" : "تسک‌های تیم " + esc(S.me.team || "")}</h1><span class="sub">گزینه‌هایی که کاربران تیم در فرم می‌بینند</span></div>` +
    tf.map(({f, x}) => `<section class="panel"><h2><span class="step">${IC.app}</span>${esc(f.title)} — ${esc(x.label)}</h2>
      <div class="help">تغییر نام یک تسک روی ثبت‌های قبلی اثر ندارد؛ آن‌ها با نام قبلی در گزارش‌ها باقی می‌مانند.</div>
      <div class="team-grid" style="${teams.length === 1 ? "grid-template-columns:1fr;max-width:620px" : ""}">${teams.map(t => {
        const k = `${f.id}|${x.id}|${t}`; if (!S.taskEdit[k]) S.taskEdit[k] = [...(x.team_options[t] || [])];
        const list = S.taskEdit[k], dirty = JSON.stringify(list) !== JSON.stringify(x.team_options[t] || []);
        return `<div class="team-card" style="cursor:default" data-k="${esc(k)}">
          <div class="th"><b>${t}</b><span class="spacer"></span><span class="tn" style="font-size:18px">${fa(list.length)}</span></div>
          <div class="task-list">${list.map((o, i) => `<div class="task-row"><input class="field-in" data-i="${i}" value="${esc(o)}">
            <button class="icon-btn" data-mv="-1" data-i="${i}" title="بالا">${IC.up}</button><button class="icon-btn" data-mv="1" data-i="${i}" title="پایین">${IC.down}</button>
            <button class="icon-btn del" data-rm="${i}" title="حذف">${IC.del}</button></div>`).join("")}</div>
          <div class="task-row" style="margin-top:8px"><input class="field-in" data-new placeholder="تسک جدید … (Enter)"><button class="btn ghost sm" data-add>+ افزودن</button></div>
          <div class="controls" style="margin-top:12px"><button class="btn primary sm" data-save ${dirty ? "" : "disabled"}>ذخیره تسک‌های ${t}</button>
            ${dirty ? `<button class="btn ghost sm" data-reset>انصراف</button><span class="msg" style="margin:0;color:var(--warn)">تغییرات ذخیره نشده</span>` : ""}</div>
        </div>`; }).join("")}</div></section>`).join("");
  m.querySelectorAll("[data-k]").forEach(card => {
    const k = card.dataset.k, [fid, xid, t] = k.split("|"), list = S.taskEdit[k];
    const sync = () => card.querySelectorAll("input[data-i]").forEach(inp => list[+inp.dataset.i] = inp.value);
    card.querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => { list[+inp.dataset.i] = inp.value; const s = card.querySelector("[data-save]"); s.disabled = false; });
    card.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { sync(); const i = +b.dataset.i, j = i + +b.dataset.mv; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; renderTasks(); });
    card.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { sync(); list.splice(+b.dataset.rm, 1); renderTasks(); });
    const add = () => { sync(); const v = card.querySelector("[data-new]").value.trim(); if (!v) return; if (list.includes(v)) return toast("این تسک وجود دارد", 1); list.push(v); renderTasks(); };
    card.querySelector("[data-add]").onclick = add;
    card.querySelector("[data-new]").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    if (card.querySelector("[data-reset]")) card.querySelector("[data-reset]").onclick = () => { delete S.taskEdit[k]; renderTasks(); };
    card.querySelector("[data-save]").onclick = async () => {
      sync(); const clean = [...new Set(list.map(s => s.trim()).filter(Boolean))];
      if (!clean.length) return toast("حداقل یک تسک لازم است", 1);
      try { await api("gf_team_set_options", {...T(), p_form_id: fid, p_field_id: xid, p_team: t, p_options: clean});
        S.reportForms = await api("gf_report_forms", T()); delete S.taskEdit[k]; renderTasks(); toast(`تسک‌های ${t} ذخیره شد ✓`);
      } catch (e) { toast(e.message, 1); }
    };
  });
}

/* ---------- team lead: own team's people (read-only) ---------- */
function renderTeamUsers() {
  const m = $("#main"), q = S.userQ.toLowerCase();
  const list = S.teamUsers.filter(u => !q || (u.full_name + " " + u.username).toLowerCase().includes(q));

  $("#uq").oninput = e => { S.userQ = e.target.value; const p = e.target.selectionStart; renderTeamUsers(); const n = $("#uq"); n.focus(); n.setSelectionRange(p, p); };

/* ---------- supervisor: users ---------- */
function renderUsers() {
  const m = $("#main"), q = S.userQ.toLowerCase(), tf = S.userTeam;
  const list = S.users.filter(u => (!tf || u.team === tf) && (!q || (u.full_name + " " + u.username).toLowerCase().includes(q)));
  const cnt = r => S.users.filter(u => u.role === r && (!tf || u.team === tf)).length;
  m.innerHTML = `<div class="page-title"><h1>کاربران</h1><span class="spacer"></span><button class="btn primary" id="nu">+ کاربر جدید</button></div>
    <div class="summary-row">
      <div class="summary-card"><div class="label">کل افراد</div><div class="value">${fa(S.users.filter(u => !tf || u.team === tf).length)}</div></div>
      <div class="summary-card"><div class="label">ادمین</div><div class="value">${fa(cnt("admin"))}</div></div>
      <div class="summary-card"><div class="label">کاربر</div><div class="value">${fa(cnt("user"))}</div></div>
      <div class="summary-card"><div class="label">غیرفعال</div><div class="value">${fa(S.users.filter(u => !u.active && (!tf || u.team === tf)).length)}</div></div>
    </div>
    <section class="panel"><div class="tbar"><h2><span class="step">۱</span>افراد</h2>
      <input class="field-in search" id="uq" placeholder="جستجوی نام یا داخلی …" value="${esc(S.userQ)}">
      <select id="ut"><option value="">همه تیم‌ها</option>${TEAMS.map(t => `<option ${tf === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      <span class="count-badge"><b>${fa(list.length)}</b> نفر</span></div>
    <div class="tablewrap"><table><thead><tr><th>نام</th><th>داخلی</th><th>تیم</th><th>نقش</th><th>وضعیت</th><th>تعداد ثبت</th><th></th></tr></thead><tbody>
    ${list.map(u => `<tr><td><b>${esc(u.full_name)}</b></td><td class="code" style="text-align:right">${esc(u.username)}</td><td>${esc(u.team || "—")}</td>
      <td><span class="tag ${u.role === "user" ? "err" : u.role === "admin" ? "doc" : "warn"}">${ROLES[u.role] || u.role}</span></td>
      <td>${u.active ? `<span class="tag ok">فعال</span>` : `<span class="tag bad">غیرفعال</span>`}</td>
      <td>${fa(u.responses)}</td><td><button class="icon-btn" data-eu="${u.id}" title="ویرایش">${IC.edit}</button></td></tr>`).join("") || `<tr><td colspan="7" class="empty">کسی پیدا نشد</td></tr>`}</tbody></table></div></section>`;
  $("#nu").onclick = () => userDialog(null);

  $("#ut").onchange = e => { S.userTeam = e.target.value; renderUsers(); };
  m.querySelectorAll("[data-eu]").forEach(b => b.onclick = () => userDialog(S.users.find(u => u.id === b.dataset.eu)));
}
function userDialog(u) {
  const isNew = !u; u = u || {username: "", full_name: "", role: "user", active: true, team: S.userTeam || ""};
  dialog(`<h3>${isNew ? "کاربر جدید" : "ویرایش کاربر"}</h3>
    <label class="l">نام و نام خانوادگی</label><input class="field-in" id="uf" value="${esc(u.full_name)}">
    <label class="l">داخلی (نام کاربری)</label><input class="field-in ltr" id="uu" value="${esc(u.username)}">
    <label class="l">${isNew ? "رمز عبور (ایمیل)" : "رمز جدید — خالی = بدون تغییر"}</label><input class="field-in ltr" id="up" placeholder="name@gmail.com">
    <div class="grid2"><div><label class="l">تیم</label><select id="utm"><option value="">—</option>${TEAMS.map(t => `<option ${u.team === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
    <div><label class="l">نقش</label><select id="ur">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
    <div class="radio-line" style="margin-top:12px"><label><input type="checkbox" id="ua" ${u.active ? "checked" : ""}> فعال</label></div>
    <div class="msg err" id="um"></div>
    <div class="controls"><button class="btn primary" data-yes>ذخیره</button><button class="btn ghost" data-no>انصراف</button></div>`,
  (d, close) => {
    d.querySelector("[data-no]").onclick = close;
    d.querySelector("[data-yes]").onclick = async () => {
      const pw = $("#up").value.trim(), uname = faNum($("#uu").value).trim().toLowerCase();
      if ($("#ur").value !== "supervisor" && !$("#utm").value) { $("#um").textContent = "تیم را انتخاب کنید"; return; }
      try { await api("gf_admin_save_user", {...T(), p_id: u.id || null, p_username: uname, p_full_name: $("#uf").value.trim(), p_password: pw, p_role: $("#ur").value, p_active: $("#ua").checked, p_team: $("#utm").value});
        close(); toast("ذخیره شد ✓"); go("users");
      } catch (e) { $("#um").textContent = e.message; } };
  });
}
